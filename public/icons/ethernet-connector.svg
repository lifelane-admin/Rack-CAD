<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 60" width="40" height="60">
  <!-- Cable body / strain relief boot -->
  <rect x="13" y="32" width="14" height="22" rx="3" ry="3" fill="#7b2fbe" stroke="#4a1080" stroke-width="1"/>
  <!-- Strain relief ribs -->
  <line x1="13" y1="38" x2="27" y2="38" stroke="rgba(0,0,0,0.35)" stroke-width="1.5"/>
  <line x1="13" y1="43" x2="27" y2="43" stroke="rgba(0,0,0,0.35)" stroke-width="1.5"/>
  <line x1="13" y1="48" x2="27" y2="48" stroke="rgba(0,0,0,0.35)" stroke-width="1.5"/>
  <!-- RJ45 plug body (transparent/clear plastic) -->
  <rect x="11" y="10" width="18" height="22" rx="1.5" ry="1.5" fill="#d0cce8" stroke="#6a3fa0" stroke-width="1.2"/>
  <!-- Gold contact pins (8 pins) -->
  <line x1="13.5" y1="11" x2="13.5" y2="18" stroke="#f0c040" stroke-width="1.2"/>
  <line x1="15.5" y1="11" x2="15.5" y2="18" stroke="#f0c040" stroke-width="1.2"/>
  <line x1="17.5" y1="11" x2="17.5" y2="18" stroke="#f0c040" stroke-width="1.2"/>
  <line x1="19.5" y1="11" x2="19.5" y2="18" stroke="#f0c040" stroke-width="1.2"/>
  <line x1="21.5" y1="11" x2="21.5" y2="18" stroke="#f0c040" stroke-width="1.2"/>
  <line x1="23.5" y1="11" x2="23.5" y2="18" stroke="#f0c040" stroke-width="1.2"/>
  <line x1="25.5" y1="11" x2="25.5" y2="18" stroke="#f0c040" stroke-width="1.2"/>
  <line x1="27.5" y1="11" x2="27.5" y2="18" stroke="#f0c040" stroke-width="1.2"/>
  <!-- Latch clip -->
  <rect x="15" y="5" width="10" height="8" rx="1" ry="1" fill="#9b6dcc" stroke="#4a1080" stroke-width="0.8"/>
  <!-- Highlight on plug body -->
  <rect x="12" y="11" width="5" height="20" rx="1" fill="rgba(255,255,255,0.12)"/>
</svg>
