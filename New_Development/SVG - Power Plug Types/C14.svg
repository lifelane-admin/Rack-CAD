<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%">
  <defs>
    <!-- Frame Gradient -->
    <linearGradient id="c14FrameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2e33"/>
      <stop offset="100%" stop-color="#151618"/>
    </linearGradient>

    <!-- Deep Recess Gradient -->
    <linearGradient id="c14RecessGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0c"/>
      <stop offset="100%" stop-color="#18191c"/>
    </linearGradient>

    <!-- Brass / Metallic Pin Gradient -->
    <linearGradient id="c14PinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="30%" stop-color="#c9a038"/>
      <stop offset="70%" stop-color="#e2bc59"/>
      <stop offset="100%" stop-color="#91701f"/>
    </linearGradient>

    <!-- Drop Shadow / Inner Bevel Effect -->
    <filter id="c14InnerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="3"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#000000" flood-opacity="0.9"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Mounting Flange / Plate -->
  <rect x="10" y="10" width="180" height="140" rx="10" fill="url(#c14FrameGrad)" stroke="#0d0e0f" stroke-width="3"/>
  <rect x="14" y="14" width="172" height="132" rx="8" fill="none" stroke="#484b52" stroke-width="1" opacity="0.5"/>

  <!-- Screw Mounting Holes -->
  <circle cx="28" cy="80" r="5" fill="#0a0a0b" stroke="#3a3d42" stroke-width="1"/>
  <circle cx="172" cy="80" r="5" fill="#0a0a0b" stroke="#3a3d42" stroke-width="1"/>

  <!-- Outer Pentagonal Bevel Frame -->
  <path d="M 52 30 L 148 30 A 10 10 0 0 1 158 40 L 158 88 L 132 118 L 68 118 L 42 88 L 42 40 A 10 10 0 0 1 52 30 Z" 
        fill="#121315" stroke="#383b40" stroke-width="2"/>

  <!-- Deep Recessed Socket Well -->
  <path d="M 56 35 L 144 35 A 8 8 0 0 1 152 43 L 152 85 L 128 112 L 72 112 L 48 85 L 48 43 A 8 8 0 0 1 56 35 Z" 
        fill="url(#c14RecessGrad)" filter="url(#c14InnerShadow)" stroke="#050505" stroke-width="2"/>

  <!-- ================= C14 MALE PRONGS (3 Pins) ================= -->
  
  <!-- Left Line Pin (Vertical) -->
  <g transform="translate(68, 52)">
    <rect x="0" y="0" width="8" height="22" rx="2" fill="url(#c14PinGrad)" stroke="#4a390e" stroke-width="0.75"/>
    <rect x="1.5" y="1.5" width="5" height="19" rx="1" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Right Neutral Pin (Vertical) -->
  <g transform="translate(124, 52)">
    <rect x="0" y="0" width="8" height="22" rx="2" fill="url(#c14PinGrad)" stroke="#4a390e" stroke-width="0.75"/>
    <rect x="1.5" y="1.5" width="5" height="19" rx="1" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Top Center Ground Pin (Vertical) -->
  <g transform="translate(96, 74)">
    <rect x="0" y="0" width="8" height="22" rx="2" fill="url(#c14PinGrad)" stroke="#4a390e" stroke-width="0.75"/>
    <rect x="1.5" y="1.5" width="5" height="19" rx="1" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
  </g>
</svg>
